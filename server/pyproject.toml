[project]
name = "htmlshare-server"
version = "0.7.1"
description = "内网 HTML 分享服务：飞书登录 + 按人授权访问"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "mcp>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["htmlshare_server"]

[tool.setuptools.package-data]
htmlshare_server = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
