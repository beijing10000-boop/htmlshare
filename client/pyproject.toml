[project]
name = "htmlshare"
version = "0.3.0"
description = "把 AI 生成的 HTML 发布到内网分享站（CLI + MCP）"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
htmlshare = "htmlshare.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["htmlshare"]

[tool.pytest.ini_options]
pythonpath = [".", "../server", "../server/tests"]
testpaths = ["tests"]
